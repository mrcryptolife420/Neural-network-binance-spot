[project]
name = "neural-network-binance-spot"
version = "0.1.0"
description = "Paper/testnet-first neural-network Binance spot trading bot scaffold."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
research = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "scikit-learn>=1.5",
  "torch>=2.3",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
ui = [
  "streamlit>=1.40",
  "plotly>=5.24",
]
visual = [
  "playwright>=1.44",
]
realtime = [
  "websockets>=12",
]
mlops = [
  "scikit-learn>=1.5",
]

[project.scripts]
spot-bot = "binance_spot_bot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
